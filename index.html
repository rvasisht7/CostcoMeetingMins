<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meetings">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Meetings</title>
<style>
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #5a6676;
    --line: #d9e0e8;
    --accent: #1f5c8b;
    --accent-soft: #dde8f2;
    --on-accent: #ffffff;
    --record: #c7362f;
    --record-soft: #f6dcda;
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b;
      --surface: #1a222c;
      --ink: #eef2f6;
      --muted: #9aa7b6;
      --line: #2a3542;
      --accent: #6fa8dc;
      --accent-soft: #1e3245;
      --on-accent: #0c1620;
      --record: #ef6a5f;
      --record-soft: #3b1f1d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font-size: 18px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; }

  /* Calendar screen */
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 8px; }
  .month { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .nav { display: flex; align-items: center; }
  .today-btn { height: 48px; padding: 0 12px; font-size: 17px; font-weight: 600; color: var(--accent); }
  .arrow { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; font-size: 30px; line-height: 1; color: var(--accent); }
  .arrow:active, .today-btn:active { background: var(--accent-soft); border-radius: 24px; }

  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .weekdays { font-size: 14px; font-weight: 600; color: var(--muted); padding: 6px 0 4px; }
  .day { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 19px; }
  .day .num { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; }
  .day.today .num { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); font-weight: 700; }
  .day.selected .num { background: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: none; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--accent); }
  .dot.none { background: transparent; }

  .day-title { font-size: 22px; font-weight: 700; margin: 22px 4px 12px; }
  .card { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card:active { background: var(--accent-soft); }
  .card-title { font-size: 19px; font-weight: 600; }
  .card-meta { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--muted); font-size: 26px; }
  .empty { color: var(--muted); padding: 6px 4px 20px; }

  .bottom { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
  .primary { width: 100%; height: 62px; border-radius: 20px; background: var(--accent); color: var(--on-accent); font-size: 21px; font-weight: 700; }
  .primary:active { opacity: 0.85; }

  /* Meeting screen */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px; }
  .text-btn { height: 48px; padding: 0 12px; font-size: 18px; font-weight: 600; color: var(--accent); }
  .title-input { width: 100%; font: inherit; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; border: 0; background: transparent; color: var(--ink); padding: 6px 4px; outline: none; }
  .title-input::placeholder { color: var(--muted); opacity: 0.7; }
  .date-row { display: flex; align-items: center; gap: 10px; padding: 4px 4px 0; color: var(--muted); font-size: 17px; }
  .date-input { font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 44px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 16px; }
  .panel-label { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }

  .rec-area { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0 6px; }
  .rec-btn { width: 108px; height: 108px; border-radius: 54px; background: var(--record); display: grid; place-items: center; box-shadow: 0 0 0 8px var(--record-soft); transition: box-shadow 0.3s; }
  .rec-btn .shape { width: 38px; height: 38px; border-radius: 19px; background: #fff; transition: border-radius 0.2s, width 0.2s, height 0.2s; }
  .rec-btn.recording .shape { width: 32px; height: 32px; border-radius: 6px; }
  .rec-btn.recording { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 8px var(--record-soft); } 50% { box-shadow: 0 0 0 18px var(--record-soft); } }
  @media (prefers-reduced-motion: reduce) { .rec-btn.recording { animation: none; } }
  .rec-hint { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .rec-hint.live { color: var(--record); font-weight: 600; font-size: 22px; }

  audio { width: 100%; }
  .secondary { width: 100%; height: 52px; margin-top: 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .notes { width: 100%; min-height: 220px; font: inherit; font-size: 18px; line-height: 1.5; border: 0; background: transparent; color: var(--ink); resize: none; outline: none; padding: 0; }
  .notes::placeholder { color: var(--muted); opacity: 0.8; }

  .danger { width: 100%; height: 52px; margin: 24px 0 calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--record); font-weight: 600; }
</style>
</head>
<body>

<!-- Calendar -->
<section id="calScreen" class="screen">
  <div class="scroll">
    <header class="cal-head">
      <div class="month" id="monthLabel"></div>
      <div class="nav">
        <button class="today-btn" id="todayBtn">Today</button>
        <button class="arrow" id="prevBtn" aria-label="Previous month">‹</button>
        <button class="arrow" id="nextBtn" aria-label="Next month">›</button>
      </div>
    </header>
    <div class="weekdays" aria-hidden="true"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="grid" id="grid"></div>
    <h2 class="day-title" id="dayTitle"></h2>
    <div id="dayList"></div>
  </div>
  <div class="bottom">
    <button class="primary" id="newBtn">+ New meeting</button>
  </div>
</section>

<!-- Meeting -->
<section id="meetScreen" class="screen" hidden>
  <div class="topbar">
    <button class="text-btn" id="backBtn">‹ Calendar</button>
    <button class="text-btn" id="shareBtn">Share</button>
  </div>
  <div class="scroll" id="meetScroll">
    <input id="titleInput" class="title-input" placeholder="Meeting name" autocomplete="off" enterkeyhint="done" aria-label="Meeting name">
    <label class="date-row">Date <input id="dateInput" class="date-input" type="date"></label>

    <div class="panel">
      <div class="panel-label">Recording</div>
      <div id="recArea" class="rec-area">
        <button id="recBtn" class="rec-btn" aria-label="Start recording"><span class="shape"></span></button>
        <div id="recHint" class="rec-hint">Tap to record</div>
      </div>
      <div id="playArea" hidden>
        <audio id="player" controls preload="metadata"></audio>
        <button id="reRecBtn" class="secondary">Record again</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">Notes</div>
      <textarea id="notesInput" class="notes" placeholder="Type what happened, or tap the microphone on the keyboard to talk."></textarea>
    </div>

    <button id="deleteBtn" class="danger">Delete meeting</button>
  </div>
</section>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtLong = s => fromYmd(s).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtDur = sec => `${Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;
const isEmpty = m => !(m.title || '').trim() && !(m.notes || '').trim() && !m.hasAudio;

/* ---------- state ---------- */
let db;
let meetings = [];               // meeting info (no audio) for the calendar
let selected = ymd(new Date());  // selected day
let view = new Date(); view.setDate(1);
let current = null;              // meeting being viewed
let currentAudio = null;         // { blob, type, url }

/* ---------- storage (IndexedDB, on the phone only) ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('meeting-notes', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('meetings', { keyPath: 'id' });
      r.result.createObjectStore('audio', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = () => req(store('meetings').getAll());
const dbPut = m => req(store('meetings', 'readwrite').put(m));
const dbDel = id => req(store('meetings', 'readwrite').delete(id));
const audioGet = id => req(store('audio').get(id));
const audioPut = a => req(store('audio', 'readwrite').put(a));
const audioDel = id => req(store('audio', 'readwrite').delete(id));

/* ---------- calendar ---------- */
function renderCalendar() {
  const y = view.getFullYear(), m = view.getMonth();
  $('monthLabel').textContent = view.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const counts = {};
  meetings.forEach(x => { counts[x.date] = (counts[x.date] || 0) + 1; });
  const grid = $('grid');
  grid.innerHTML = '';
  const firstDay = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const today = ymd(new Date());
  for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const b = document.createElement('button');
    b.className = 'day' + (key === today ? ' today' : '') + (key === selected ? ' selected' : '');
    const c = counts[key] || 0;
    b.setAttribute('aria-label', fmtLong(key) + (c ? `, ${c} meeting${c > 1 ? 's' : ''}` : ''));
    const num = document.createElement('span'); num.className = 'num'; num.textContent = d;
    const dot = document.createElement('span'); dot.className = 'dot' + (c ? '' : ' none');
    b.append(num, dot);
    b.onclick = () => { selected = key; renderCalendar(); renderDay(); };
    grid.appendChild(b);
  }
}

function renderDay() {
  $('dayTitle').textContent = selected === ymd(new Date()) ? `Today, ${fmtLong(selected).split(', ').slice(1).join(', ')}` : fmtLong(selected);
  const list = $('dayList');
  list.innerHTML = '';
  const items = meetings.filter(x => x.date === selected).sort((a, b) => a.createdAt - b.createdAt);
  if (!items.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'No meetings this day. Tap “New meeting” to add one.';
    list.appendChild(p);
    return;
  }
  items.forEach(x => {
    const b = document.createElement('button');
    b.className = 'card';
    const left = document.createElement('div');
    const t = document.createElement('div'); t.className = 'card-title'; t.textContent = (x.title || '').trim() || 'Meeting';
    const meta = document.createElement('div'); meta.className = 'card-meta';
    const bits = [fmtTime(x.createdAt)];
    if (x.hasAudio) bits.push(`recording ${fmtDur(x.duration || 0)}`);
    if ((x.notes || '').trim()) bits.push('notes');
    meta.textContent = bits.join(', ');
    left.append(t, meta);
    const chev = document.createElement('span'); chev.className = 'chev'; chev.textContent = '›';
    b.append(left, chev);
    b.onclick = () => openMeeting(x.id);
    list.appendChild(b);
  });
}

function showCalendar(date) {
  selected = date;
  const d = fromYmd(date);
  view = new Date(d.getFullYear(), d.getMonth(), 1);
  $('player').pause();
  $('player').removeAttribute('src');
  if (currentAudio) { URL.revokeObjectURL(currentAudio.url); currentAudio = null; }
  current = null;
  $('meetScreen').hidden = true;
  $('calScreen').hidden = false;
  renderCalendar();
  renderDay();
}

/* ---------- meeting screen ---------- */
async function openMeeting(id) {
  if (id) {
    current = { ...meetings.find(x => x.id === id) };
  } else {
    current = { id: newId(), title: '', date: selected, notes: '', hasAudio: false, duration: 0, createdAt: Date.now(), updatedAt: Date.now() };
  }
  $('titleInput').value = current.title;
  $('dateInput').value = current.date;
  $('notesInput').value = current.notes;
  await loadAudio();
  showRecState();
  $('calScreen').hidden = true;
  $('meetScreen').hidden = false;
  $('meetScroll').scrollTop = 0;
}

async function loadAudio() {
  if (currentAudio) URL.revokeObjectURL(currentAudio.url);
  currentAudio = null;
  $('player').removeAttribute('src');
  if (!current.hasAudio) return;
  const a = await audioGet(current.id);
  if (!a) return;
  const blob = new Blob([a.data], { type: a.type });
  currentAudio = { blob, type: a.type, url: URL.createObjectURL(blob) };
  $('player').src = currentAudio.url;
}

let saveTimer;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrent, 400); }

async function saveCurrent() {
  clearTimeout(saveTimer);
  if (!current) return;
  current.title = $('titleInput').value;
  current.notes = $('notesInput').value;
  current.date = $('dateInput').value || current.date;
  current.updatedAt = Date.now();
  const exists = meetings.some(x => x.id === current.id);
  if (isEmpty(current) && !exists) return; // don't keep a blank meeting
  await dbPut(current);
  const i = meetings.findIndex(x => x.id === current.id);
  if (i >= 0) meetings[i] = { ...current }; else meetings.push({ ...current });
}

async function closeMeeting() {
  if (isRecording()) await stopRecording();
  await saveCurrent();
  if (isEmpty(current)) {
    await dbDel(current.id).catch(() => {});
    await audioDel(current.id).catch(() => {});
    meetings = meetings.filter(x => x.id !== current.id);
  }
  showCalendar(current.date);
}

async function deleteMeeting() {
  if (!confirm('Delete this meeting? This can’t be undone.')) return;
  if (isRecording()) await stopRecording();
  clearTimeout(saveTimer);
  await dbDel(current.id).catch(() => {});
  await audioDel(current.id).catch(() => {});
  meetings = meetings.filter(x => x.id !== current.id);
  showCalendar(current.date);
}

/* ---------- recording ---------- */
let recorder = null, recStream = null, recChunks = [], recStart = 0, recTick = null, recDone = null, wakeLock = null;
const isRecording = () => !!recorder && recorder.state === 'recording';

function pickType() {
  if (!window.MediaRecorder) return null;
  for (const t of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function showRecState() {
  const rec = isRecording();
  const showPlayer = !!currentAudio && !rec;
  $('recArea').hidden = showPlayer;
  $('playArea').hidden = !showPlayer;
  $('recBtn').classList.toggle('recording', rec);
  $('recBtn').setAttribute('aria-label', rec ? 'Stop recording' : 'Start recording');
  $('recHint').classList.toggle('live', rec);
  if (!rec) $('recHint').textContent = 'Tap to record';
}

async function startRecording() {
  const type = pickType();
  if (type === null || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Recording isn’t available here. You can still type notes below.');
    return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert('The microphone is turned off for this app. Open Settings, then Apps, then Safari, then Microphone, and choose Allow. Then try again.');
    return;
  }
  $('player').pause();
  recChunks = [];
  recorder = new MediaRecorder(recStream, type ? { mimeType: type } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recDone = new Promise(res => { recorder.onstop = () => finishRecording().then(res); });
  recorder.start(1000);
  recStart = Date.now();
  $('recHint').textContent = '0:00  Tap to stop';
  recTick = setInterval(() => { $('recHint').textContent = `${fmtDur((Date.now() - recStart) / 1000)}  Tap to stop`; }, 250);
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  showRecState();
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  return recDone || Promise.resolve();
}

async function finishRecording() {
  clearInterval(recTick);
  if (recStream) recStream.getTracks().forEach(t => t.stop());
  try { if (wakeLock) await wakeLock.release(); } catch (e) {}
  wakeLock = null;
  const type = (recorder.mimeType || 'audio/mp4').split(';')[0];
  const blob = new Blob(recChunks, { type });
  const duration = Math.round((Date.now() - recStart) / 1000);
  recorder = null;
  recDone = null;
  if (blob.size && current) {
    await audioPut({ id: current.id, type, data: await blob.arrayBuffer() });
    current.hasAudio = true;
    current.duration = duration;
    await saveCurrent();
    await loadAudio();
  }
  showRecState();
}

/* ---------- share (text message, email, etc.) ---------- */
function shareMeeting() {
  const title = ($('titleInput').value || '').trim() || 'Meeting';
  const date = $('dateInput').value || current.date;
  const notes = ($('notesInput').value || '').trim();
  const text = [title, fmtLong(date)].concat(notes ? ['', notes] : []).join('\n');
  const data = { title, text };
  if (currentAudio) {
    const ext = currentAudio.type.includes('mp4') ? 'm4a' : currentAudio.type.includes('webm') ? 'webm' : 'audio';
    const name = (title.replace(/[^\w\- ]+/g, '').trim() || 'Meeting') + ' ' + date + '.' + ext;
    const file = new File([currentAudio.blob], name, { type: currentAudio.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
  }
  if (navigator.share) {
    navigator.share(data).catch(e => { if (e.name !== 'AbortError') copyText(text); });
  } else {
    copyText(text);
  }
}
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('Notes copied. Paste them into a message.'), () => alert(text));
  } else {
    alert(text);
  }
}

/* ---------- wire up ---------- */
$('prevBtn').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCalendar(); };
$('nextBtn').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCalendar(); };
$('todayBtn').onclick = () => showCalendar(ymd(new Date()));
$('newBtn').onclick = () => openMeeting(null);
$('backBtn').onclick = closeMeeting;
$('deleteBtn').onclick = deleteMeeting;
$('shareBtn').onclick = shareMeeting;
$('recBtn').onclick = () => (isRecording() ? stopRecording() : startRecording());
$('reRecBtn').onclick = () => { if (confirm('Replace the recording with a new one?')) startRecording(); };
$('titleInput').addEventListener('input', scheduleSave);
$('titleInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('notesInput').addEventListener('input', scheduleSave);
$('dateInput').addEventListener('change', () => { if (!$('dateInput').value) $('dateInput').value = current.date; scheduleSave(); });

// Save if she switches apps or locks the phone
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (isRecording()) stopRecording();
    saveCurrent();
  }
});
window.addEventListener('pagehide', () => saveCurrent());

(async () => {
  try {
    db = await openDB();
    meetings = await dbAll();
  } catch (e) {
    alert('Meetings couldn’t be loaded: ' + e.message);
  }
  renderCalendar();
  renderDay();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
